# Omarchy ships a complete tmux config at ~/.config/tmux/tmux.conf, and tmux
# loads BOTH files in sequence -- this one first, Omarchy's second. Its default
# search path is compiled in as:
#
#   /etc/tmux.conf : ~/.tmux.conf : $XDG_CONFIG_HOME/tmux/tmux.conf : ~/.config/tmux/tmux.conf
#
# So anything set here that Omarchy also sets is silently overridden by it.
# This file is therefore only for what Omarchy does not provide.
#
# Dropped from the old config, all of it either redundant or already losing:
#   default-terminal screen-256color  Omarchy sets tmux-256color plus an RGB
#                                     terminal-override, i.e. true colour
#   mouse on, escape-time             Omarchy sets both to the same values
#   window-status-current-*           Omarchy themes the whole status bar
#   bind r  (reload)                  lost to Omarchy's rename-window
#   bind h  (resize left)             lost to Omarchy's split-window
#   bind k  (resize up)               lost to Omarchy's kill-window -- this one
#                                     was actively dangerous, muscle memory for
#                                     "resize" was killing the window
#   bind j / bind l (resize)          Omarchy binds C-M-Shift-arrows instead
#   bind x  (kill-pane)               Omarchy binds the same thing
#   bind m  (zoom)                    tmux has had `prefix z` built in for years
#   tpm                               unused; see the note below

# --- smart-splits.nvim ------------------------------------------------------
# Seamless C-h/j/k/l between tmux panes and Neovim splits. Replaces
# vim-tmux-navigator, which could not speak herdr; smart-splits.nvim has
# backends for both. Resizing is left to the multiplexer's own bindings
# (Omarchy binds C-M-Shift-arrows), which keeps M-h/j/k/l free.
#
# No tmux plugin to install: smart-splits.nvim sets a pane-local @pane-is-vim
# variable from the Neovim side, and these bindings just read it. That sidesteps
# tpm entirely, which matters here because tpm cannot work on Omarchy -- it
# parses exactly one config file and prefers ~/.config/tmux/tmux.conf, which
# Omarchy ships with no @plugin lines, so it finds nothing and exits silently.
#
# The Neovim half must NOT be lazy-loaded or @pane-is-vim stays unset and these
# forward nowhere; see the plugin spec in the nvim package.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'


# --- kept ------------------------------------------------------------------
# Omarchy binds neither of these, and | / - are the visual mnemonic: the
# character looks like the divider you get. Omarchy's equivalents are
# Alt-Enter and Alt-Shift-Enter, which need no prefix -- worth learning, but
# these cost nothing to keep. -c opens the new pane in the current directory,
# matching Omarchy's behaviour.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
