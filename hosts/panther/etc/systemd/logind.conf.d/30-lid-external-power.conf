# Stay awake when the external display drops out in clamshell mode.
#
# logind resolves a lid-close in this order (logind.conf(5)):
#
#   docked or >1 display -> HandleLidSwitchDocked   (Omarchy leaves this "ignore")
#   on external power    -> HandleLidSwitchExternalPower
#   otherwise            -> HandleLidSwitch         (defaults to "suspend")
#
# The trap is the middle rule: HandleLidSwitchExternalPower is "completely
# ignored by default -- an explicit value must be set before it will be used".
# So with the lid shut and the external display gone, the machine stops
# counting as docked, falls straight past the unset rule, and suspends -- even
# though it is plugged in and the session is live. A flaky cable or a monitor
# dropping out of DPMS is enough to trigger it.
#
# On AC, suspending there is never wanted: the fix is to open the lid, which
# you cannot do if it already went to sleep. On battery the default still
# applies, so closing the lid away from power suspends as before.
[Login]
HandleLidSwitchExternalPower=ignore
