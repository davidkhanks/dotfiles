# Point every user process at our own ssh-agent (see
# ~/.config/systemd/user/ssh-agent.service), which is started with the PKCS#11
# whitelist the stock Arch unit lacks.
#
# .bashrc exports this too, but only for interactive shells. This file covers
# systemd user services, GUI-launched apps and non-interactive scripts.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.sock
